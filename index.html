<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brabrand</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-mouse-position@1.2.0/src/L.Control.MousePosition.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-mouse-position@1.2.0/src/L.Control.MousePosition.css"/>
    <!-- MarkerCluster plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        #map { height: 100vh; width: 100vw; }
        .leaflet-control-geocoder {
            background: white;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
        /* Kort-overskrift */
        #map-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: rgba(255,255,255,0.95);
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            pointer-events: none;
        }
        
        /* Custom cluster styling */
        .marker-cluster-small {
            background-color: rgba(181, 226, 140, 0.8);
            border: 2px solid rgba(110, 204, 57, 0.8);
        }
        .marker-cluster-medium {
            background-color: rgba(241, 211, 87, 0.8);
            border: 2px solid rgba(240, 194, 12, 0.8);
        }
        .marker-cluster-large {
            background-color: rgba(253, 156, 115, 0.8);
            border: 2px solid rgba(241, 128, 23, 0.8);
        }
        .marker-cluster {
            border-radius: 20px;
        }
        .marker-cluster div {
            width: 36px;
            height: 36px;
            margin-left: 2px;
            margin-top: 2px;
            text-align: center;
            border-radius: 18px;
            font: 12px 'Arial', sans-serif;
            font-weight: bold;
        }
        .marker-cluster span {
            line-height: 36px;
            color: #fff;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="map-title">Brabrand i gennem tiden</div>
    <script>
        var map = L.map('map', {
            center: [56.158, 10.139],
            zoom: 15,
            attributionControl: false // fjern standard Leaflet-attribution
        });

        // Base maps
        // OpenStreetMap Standard
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        });

        // ESRI Satellit kort
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© ESRI',
            maxZoom: 19
        });

        // OpenTopoMap (topografisk kort)
        var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenTopoMap',
            maxZoom: 17
        });

        // ESRI World Street Map
        var streets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© ESRI',
            maxZoom: 19
        });

        // OpenStreetMap Humanitarian
        var humanitarian = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors, Humanitarian OpenStreetMap Team',
            maxZoom: 19
        });

        // CartoDB Dark Matter (mørkt tema)
        var dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB',
            maxZoom: 19
        });

        // Historiske kort som overlay (nu i mappen 1980)
        var historiskKort = L.tileLayer('./1980/{z}/{x}/{y}.png', {
            attribution: '© Erik Oehlerich',
            minZoom: 11,
            maxZoom: 17,
            tileSize: 256,
            opacity: 1.0,  // Fuld synlighed
            bounds: [[55.9, 9.9], [56.4, 10.4]], // Meget større område omkring Brabrand
            noWrap: true,
            errorTileUrl: '', // Skjul fejl-tiles
            updateWhenIdle: true
        });

        // Nyt historisk lag fra mappen 1953-1976
        var historiskKort1953 = L.tileLayer('./1953-1976/{z}/{x}/{y}.png', {
            attribution: '© Erik Oehlerich',
            minZoom: 11,
            maxZoom: 17,
            tileSize: 256,
            opacity: 1.0,
            bounds: [[55.9, 9.9], [56.4, 10.4]],
            noWrap: true,
            errorTileUrl: '',
            updateWhenIdle: true
        });

        // Nyt historisk lag fra mappen 1840-1890
        var historiskKort1840 = L.tileLayer('./1840-1890/{z}/{x}/{y}.png', {
            attribution: '© Erik Oehlerich',
            minZoom: 11,
            maxZoom: 17,
            tileSize: 256,
            opacity: 1.0,
            bounds: [[55.9, 9.9], [56.4, 10.4]],
            noWrap: true,
            errorTileUrl: '',
            updateWhenIdle: true
        });

        // Samling af alle historiske overlays (bruges til initial visning og opacity-kontrol)
        var historiskeOverlays = [historiskKort, historiskKort1953, historiskKort1840];

        // Definér base og overlay maps
        var baseMaps = {
            "OpenStreetMap": osm,
            "Satellit": satellite,
            "Topografisk": topo,
            "Vejkort": streets,
            "Humanitarian": humanitarian,
            "Mørkt tema": dark
        };

        // Opret koordinat-vælger gruppe
        var koordinatGruppe = L.layerGroup();
        
        // Marker og kontrol (ikke tilføjet til map før laget aktiveres)
        var marker = null;
        var koordinatInfo = L.control({position: 'topleft'});
        
        koordinatInfo.onAdd = function(map) {
            this._div = L.DomUtil.create('div', 'koordinat-info');
            // Minimal stil så boksen er lille og diskret
            this._div.style.background = 'rgba(255,255,255,0.95)';
            this._div.style.padding = '6px 8px';
            this._div.style.margin = '10px';
            this._div.style.border = '1px solid rgba(0,0,0,0.2)';
            this._div.style.borderRadius = '4px';
            this._div.style.fontSize = '13px';
            this._div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.2)';
            this._div.innerHTML = '<strong>Valgte koordinater</strong><br><span style="font-size:12px;color:#333">Klik på kortet for at vælge</span>';
            return this._div;
        };

        // Klik-handler: sæt markør, vis koordinater og kopier automatisk
        var clickHandler = function(e) {
            if (marker) {
                koordinatGruppe.removeLayer(marker);
            }
            marker = L.circleMarker(e.latlng, {
                radius: 6,
                color: '#d9534f',
                weight: 1,
                fillColor: '#d9534f',
                fillOpacity: 0.9
            });
            koordinatGruppe.addLayer(marker);

            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);
            var coords = lat + ', ' + lng;

            // Opdater kontrolboksen
            koordinatInfo._div.innerHTML = '<strong>Valgte koordinater</strong><br>' +
                                           '<div style="margin-top:4px;">Lat: ' + lat + '<br>Lng: ' + lng + '</div>' +
                                           '<div style="margin-top:6px;color:#2e7d32;font-weight:600;">Kopieret til udklipsholder</div>';

            // Kopier til udklipsholder (kræver HTTPS eller localhost)
            navigator.clipboard.writeText(coords).then(function() {
                // Vis kort bekræftelse i konsol (valgfrit)
                console.log('Koordinater kopieret: ' + coords);
            }).catch(function(err){
                console.warn('Kunne ikke kopiere koordinater:', err);
            });

            // Gør beskeden midlertidig (tilbage til instruks efter 2s)
            setTimeout(function() {
                if (koordinatInfo._div) {
                    koordinatInfo._div.innerHTML = '<strong>Valgte koordinater</strong><br><span style="font-size:12px;color:#333">Klik på kortet for at vælge</span>';
                }
            }, 2000);
        };

        // Håndter aktivering/deaktivering via layer-control
        map.on('overlayadd', function(e) {
            if (e.layer === koordinatGruppe) {
                // Vis kontrol og begynd lytte efter klik
                koordinatInfo.addTo(map);
                map.on('click', clickHandler);
            }
        });
        map.on('overlayremove', function(e) {
            if (e.layer === koordinatGruppe) {
                // Fjern kontrol og stop lytning; ryd markør
                koordinatInfo.remove();
                map.off('click', clickHandler);
                if (marker) {
                    koordinatGruppe.removeLayer(marker);
                    marker = null;
                }
            }
        });
        
        // Hvis brugeren vil have koordinatværktøjet aktivt ved load, kan man tilføje:
        // koordinatGruppe.addTo(map);
        // koordinatInfo.addTo(map);
        // map.on('click', clickHandler);

        // Opdateret overlay maps — kronologisk sorteret og koordinat-vælger
        var overlayMaps = {
            "Brabrand 1840-1890": historiskKort1840,
            "Brabrand 1953-1976": historiskKort1953,
            "Brabrand 1980-2001": historiskKort,
            "Koordinat vælger": koordinatGruppe
        };

        // Tilføj layer control så menuen med kortlag vises
        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // 1980-kortet ikke aktiveret som standard - kun 1840 er aktiveret længere nede

        // Opacity-kontrol til historiske overlay (kompakt, foldbar)
        var opacityControl = L.control({ position: 'topright' });
        opacityControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'opacity-control');
            div.style.background = 'rgba(255,255,255,0.95)';
            div.style.padding = '4px';
            div.style.margin = '10px';
            div.style.border = '1px solid rgba(0,0,0,0.15)';
            div.style.borderRadius = '4px';
            div.style.fontSize = '12px';
            div.style.width = '140px';
            // foldbar header + skjult indhold
            div.innerHTML = '<div id="opacityHeader" style="cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;">' +
                            '<span>Historisk</span><span style="font-size:12px;" id="opacityToggleIcon">▾</span></div>' +
                            '<div id="opacityContent" style="display:block;margin-top:6px;">' +
                            '<div style="font-size:12px;margin-bottom:4px;">Opacity</div>' +
                            '<input id="overlayOpacity" type="range" min="0" max="100" value="100" style="width:120px;"><br>' +
                            '<div style="font-size:11px;margin-top:4px;"><span id="opacityVal">100%</span></div>' +
                            '</div>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        opacityControl.addTo(map);

        // fold/ud for opacity
        (function(){
            var hdr = document.getElementById('opacityHeader');
            var content = document.getElementById('opacityContent');
            var icon = document.getElementById('opacityToggleIcon');
            if (hdr && content && icon) {
                hdr.addEventListener('click', function(){
                    if (content.style.display === 'none') { content.style.display = 'block'; icon.textContent = '▾'; }
                    else { content.style.display = 'none'; icon.textContent = '▸'; }
                });
            }
        })();

        document.getElementById('overlayOpacity').addEventListener('input', function(e) {
            var p = parseInt(this.value, 10) / 100;
            document.getElementById('opacityVal').textContent = this.value + '%';
            // Sæt opacity for alle historiske overlays (loop for fremtidig udvidelse)
            historiskeOverlays.forEach(function(layer){
                if (layer && typeof layer.setOpacity === 'function') {
                    layer.setOpacity(p);
                }
            });
        });

        // Opret lag til lokaliteter (så det kan toggles)
        var lokaliteterLayer = L.layerGroup();
        // Liste over alle markører (bruges til filtrering)
        var allMarkers = [];
        
        // Year-filter funktioner og UI (kompakt, foldbar)
        var yearFilterControl = L.control({ position: 'topright' });
        yearFilterControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'year-filter-control');
            div.style.background = 'rgba(255,255,255,0.95)';
            div.style.padding = '4px';
            div.style.margin = '10px';
            div.style.border = '1px solid rgba(0,0,0,0.15)';
            div.style.borderRadius = '4px';
            div.style.fontSize = '12px';
            div.style.width = '160px';
            div.innerHTML = '<div id="yearHeader" style="cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;">' +
                            '<span>Filter år</span><span style="font-size:12px;" id="yearToggleIcon">▾</span></div>' +
                            '<div id="yearContent" style="display:block;margin-top:6px;font-size:12px;">' +
                            '<div style="font-size:11px;margin-bottom:4px;">Fra: <span id="yrMinLbl">—</span> Til: <span id="yrMaxLbl">—</span></div>' +
                            '<input id="yrMin" type="range" min="1900" max="2100" value="1900" style="width:140px;"><br>' +
                            '<input id="yrMax" type="range" min="1900" max="2100" value="2100" style="width:140px;margin-top:6px;"><br>' +
                            '<label style="font-size:11px;margin-top:6px;display:block;"><input id="yrUnknown" type="checkbox" checked> Vis ukendte år</label>' +
                            '</div>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        yearFilterControl.addTo(map);
        
        // Cluster funktion er altid aktiveret - ingen kontrol nødvendig
        var allClusterLayers = [];

        // fold/ud for year filter
        (function(){
            var hdr = document.getElementById('yearHeader');
            var content = document.getElementById('yearContent');
            var icon = document.getElementById('yearToggleIcon');
            if (hdr && content && icon) {
                hdr.addEventListener('click', function(){
                    if (content.style.display === 'none') { content.style.display = 'block'; icon.textContent = '▾'; }
                    else { content.style.display = 'none'; icon.textContent = '▸'; }
                });
            }
        })();

        function applyYearFilter() {
            var min = parseInt(document.getElementById('yrMin').value, 10);
            var max = parseInt(document.getElementById('yrMax').value, 10);
            var showUnknown = document.getElementById('yrUnknown').checked;
            allMarkers.forEach(function(m) {
                var y = m._year;
                var inRange = false;
                if (isFinite(y)) inRange = (y >= min && y <= max);
                else inRange = showUnknown;

                // tilføj/fjern fra lokaliteterLayer
                if (inRange) {
                    if (!lokaliteterLayer.hasLayer(m)) lokaliteterLayer.addLayer(m);
                } else {
                    if (lokaliteterLayer.hasLayer(m)) lokaliteterLayer.removeLayer(m);
                }
            });
        }

        function updateYearFilterUI(min, max) {
            var minInput = document.getElementById('yrMin');
            var maxInput = document.getElementById('yrMax');
            var minLbl = document.getElementById('yrMinLbl');
            var maxLbl = document.getElementById('yrMaxLbl');
            if (!minInput || !maxInput) return;
            minInput.min = min;
            minInput.max = max;
            maxInput.min = min;
            maxInput.max = max;
            minInput.value = min;
            maxInput.value = max;
            minLbl.textContent = min;
            maxLbl.textContent = max;

            // events
            minInput.oninput = function() {
                var v = parseInt(this.value,10);
                if (v > parseInt(maxInput.value,10)) { this.value = maxInput.value; v = parseInt(this.value,10); }
                minLbl.textContent = v;
                applyYearFilter();
            };
            maxInput.oninput = function() {
                var v = parseInt(this.value,10);
                if (v < parseInt(minInput.value,10)) { this.value = minInput.value; v = parseInt(this.value,10); }
                maxLbl.textContent = v;
                applyYearFilter();
            };
            var unk = document.getElementById('yrUnknown');
            unk.onchange = applyYearFilter;
        }

        // Funktion: indlæs CSV fra en sti og opret et navngivet lag (fallback)
        function loadCSVToMap(path, layerName) {
            console.log('Forsøger at indlæse CSV fra:', path);
            return fetch(encodeURI(path)).then(function(resp) {
                console.log('CSV Fetch response:', resp.status, resp.statusText);
                if (!resp.ok) throw new Error('CSV fil ikke fundet: ' + path + ' (' + resp.status + ')');
                return resp.text();
            }).then(function(csvText) {
                console.log('CSV indlæst, længde:', csvText.length);
                
                // Automatisk detektering af separator ($ eller ,)
                var separator = '$';
                var lines = csvText.split('\n');
                if (lines.length > 0) {
                    var firstLine = lines[0];
                    var dollarCount = (firstLine.match(/\$/g) || []).length;
                    var commaCount = (firstLine.match(/,/g) || []).length;
                    // Brug den separator der forekommer mest i første linje
                    if (commaCount > dollarCount) {
                        separator = ',';
                    }
                }
                console.log('Bruger separator:', separator);
                
                // Parse CSV med auto-detekteret separator
                var headers = lines[0].split(separator);
                var rows = [];
                
                for (var i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    var values;
                    
                    if (separator === ',') {
                        // Simpel CSV parsing for komma-separeret (håndterer anførselstegn)
                        values = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                        values = values.map(function(val) {
                            return val.replace(/^"(.*)"$/, '$1').trim();
                        });
                    } else {
                        // Dollar-separeret parsing
                        values = lines[i].split(separator);
                    }
                    
                    var row = {};
                    for (var j = 0; j < headers.length && j < values.length; j++) {
                        row[headers[j]] = values[j] || '';
                    }
                    rows.push(row);
                }

                console.log('CSV rækker (parsed):', rows.length);
                if (rows.length === 0) {
                    console.warn('Ingen rækker fundet i CSV-filen.');
                    return;
                }

                // Opret et nyt lag til denne CSV
                var csvLayer = L.layerGroup();
                var csvMarkers = [];
                var added = 0;

                // Vis kun de første 10 rækker som eksempel (da CSV'er ikke har koordinater)
                var maxRows = Math.min(rows.length, 10);

                for (var i = 0; i < maxRows; i++) {
                    var row = rows[i];
                    if (i < 3) console.log('CSV række', i, row); // vis et par rækker til debugging

                    var navn = row['navn'] || '';
                    var stednavn = row['Stednavn'] || '';
                    var adresse = row['Adresse'] || row['Matr_nr_adresse'] || '';
                    var alder = row['Alder'] || row['age'] || '';
                    var erhverv = row['Erhverv'] || '';
                    var fødested = row['fødested'] || '';
                    var køn = row['køn'] || row['sex'] || '';
                    var civilstand = row['Civilstand'] || row['marital_status'] || '';

                    // Placer punkter tilfældigt omkring Brabrand (da CSV'er ikke har koordinater)
                    var lat = 56.158 + (Math.random() - 0.5) * 0.02; 
                    var lng = 10.139 + (Math.random() - 0.5) * 0.02;

                    // Bestem farve baseret på køn
                    var fillColor = '#666666'; // fallback
                    if (køn === 'M' || køn === 'm') {
                        fillColor = '#4285f4'; // blå for mænd
                    } else if (køn === 'K' || køn === 'k') {
                        fillColor = '#ea4335'; // rød for kvinder
                    }

                    var marker = L.circleMarker([lat, lng], {
                        radius: 5,
                        color: fillColor,
                        weight: 2,
                        fillColor: fillColor,
                        fillOpacity: 0.6
                    });

                    var popup = '<div style="max-width:260px;font-size:13px;line-height:1.3;">' +
                                '<div style="color:#d32f2f;font-weight:600;margin-bottom:4px;">⚠️ CSV-data (tilfældig placering)</div>' +
                                (navn ? '<div><strong>Navn:</strong> ' + navn + '</div>' : '') +
                                (stednavn ? '<div><strong>Sted:</strong> ' + stednavn + '</div>' : '') +
                                (adresse ? '<div><strong>Adresse:</strong> ' + adresse + '</div>' : '') +
                                (alder ? '<div><strong>Alder:</strong> ' + alder + '</div>' : '') +
                                (køn ? '<div><strong>Køn:</strong> ' + køn + '</div>' : '') +
                                (civilstand ? '<div><strong>Civilstand:</strong> ' + civilstand + '</div>' : '') +
                                (erhverv ? '<div><strong>Erhverv:</strong> ' + erhverv + '</div>' : '') +
                                (fødested ? '<div><strong>Fødested:</strong> ' + fødested + '</div>' : '') +
                                '<div style="margin-top:6px;font-size:11px;color:#666;">Konverter til Excel for præcise koordinater</div>' +
                                '</div>';
 
                    marker.bindPopup(popup);
                    allMarkers.push(marker);
                    csvLayer.addLayer(marker);
                    csvMarkers.push(marker);
                    added++;
                }

                // Tilføj overlay til layer control
                try { 
                    layerControl.addOverlay(csvLayer, layerName); 
                    console.log('Tilføjet CSV-lag:', layerName, 'med', added, 'eksempel-punkter');
                } catch(e) {
                    console.error('Kunne ikke tilføje CSV overlay:', e);
                }
 
                console.log('Eksempel-markers tilføjet fra CSV:', added, 'af', rows.length, 'rækker');
                // Laget starter ikke aktivt - brugeren skal selv tænde det
                
            }).catch(function(err){
                console.error('Kunne ikke indlæse eller parse CSV:', err);
            });
        }

        // Funktion: indlæs Excel (xlsx) fra en sti og opret et navngivet lag
        function loadExcelToMap(path, layerName) {
            console.log('🔄 Indlæser Excel:', path);
            return fetch(encodeURI(path)).then(function(resp) {
                console.log('📁 Fetch response for', path, ':', resp.status, resp.statusText);
                if (!resp.ok) {
                    console.error('❌ Excel fil ikke fundet:', path, '- Status:', resp.status);
                    throw new Error('Excel fil ikke fundet: ' + path + ' (' + resp.status + ')');
                }
                console.log('✅ Excel fil fundet, indlæser data...');
                return resp.arrayBuffer();
            }).then(function(ab) {
                var workbook;
                try {
                    workbook = XLSX.read(ab, {type: 'array'});
                } catch (err) {
                    console.error('XLSX.read fejlede:', err);
                    // Prøv fallback som binary string
                    try {
                        var s = new Uint8Array(ab);
                        var binary = Array.prototype.map.call(s, function(ch){ return String.fromCharCode(ch); }).join('');
                        workbook = XLSX.read(binary, {type: 'binary'});
                        console.warn('Brugte binary-fallback til at læse workbook');
                    } catch (err2) {
                        throw err2;
                    }
                }

                console.log('📊 Workbook sheets:', workbook.SheetNames);
                var firstSheetName = workbook.SheetNames[0];
                console.log('📋 Bruger ark:', firstSheetName);
                var worksheet = workbook.Sheets[firstSheetName];
                var rows = XLSX.utils.sheet_to_json(worksheet, {defval: ''});

                console.log('📈 Excel rækker (parsed):', rows.length);
                if (rows.length === 0) {
                    console.warn('⚠️ Ingen rækker fundet i arket:', firstSheetName);
                    return;
                }
                
                // Vis kolonnenavne og første rækker
                console.log('=== DETALJERET EXCEL DEBUGGING ===' );
                console.log('🏷️ Alle kolonnenavne:', Object.keys(rows[0]));
                
                // Vis første 3 rækker komplet
                for (var debugRow = 0; debugRow < Math.min(3, rows.length); debugRow++) {
                    console.log('Række ' + (debugRow + 1) + ':', rows[debugRow]);
                }
                
                // Søg specifikt efter koordinat-relaterede kolonner
                var coordColumns = [];
                Object.keys(rows[0]).forEach(function(key) {
                    var lowerKey = key.toLowerCase();
                    if (lowerKey.includes('koordinat') || lowerKey.includes('coord') || 
                        lowerKey.includes('lat') || lowerKey.includes('lng') || 
                        lowerKey.includes('lon') || lowerKey.includes('bredde') || 
                        lowerKey.includes('længde')) {
                        coordColumns.push(key);
                    }
                });
                console.log('📏 Potentielle koordinat-kolonner:', coordColumns);
                
                // Vis data for koordinat-kolonner
                if (coordColumns.length > 0) {
                    for (var i = 0; i < Math.min(5, rows.length); i++) {
                        console.log('Række ' + (i+1) + ' koordinat-data:');
                        coordColumns.forEach(function(col) {
                            console.log('  ' + col + ':', rows[i][col]);
                        });
                    }
                } else {
                    console.warn('❌ INGEN koordinat-kolonner fundet!');
                }

                // Opret et nyt cluster-lag specifikt for denne Excel-fil
                var excelLayer = L.markerClusterGroup({
                    maxClusterRadius: 50,  // Hvor tæt punkter skal være for at blive clusteret
                    spiderfyOnMaxZoom: true,  // Vis individuelle markører ved max zoom
                    showCoverageOnHover: false,  // Skjul coverage område ved hover
                    zoomToBoundsOnClick: true,  // Zoom til cluster ved klik
                    iconCreateFunction: function(cluster) {
                        var count = cluster.getChildCount();
                        var className = 'marker-cluster ';
                        
                        // Forskellige størrelser baseret på antal punkter
                        if (count < 10) {
                            className += 'marker-cluster-small';
                        } else if (count < 100) {
                            className += 'marker-cluster-medium';
                        } else {
                            className += 'marker-cluster-large';
                        }
                        
                        return L.divIcon({
                            html: '<div><span>' + count + '</span></div>',
                            className: className,
                            iconSize: L.point(40, 40)
                        });
                    }
                });
                var added = 0;
                rows.forEach(function(row, i) {
                    // Hent data fra rækken - tilpasset til folketællings-data
                    var navn = row['navn'] || '';
                    var stednavn = row['Stednavn'] || '';
                    var adresse = row['Adresse'] || row['Matr_nr_adresse'] || '';
                    var alder = row['Alder'] || row['age'] || '';
                    var køn = row['køn'] || row['sex'] || '';
                    var erhverv = row['Erhverv'] || '';
                    var civilstand = row['Civilstand'] || row['marital_status'] || '';
                    var fødested = row['fødested'] || '';

                    // Søg efter Brabrand, Holmstrupgaard eller Gellerup
                    var isTargetLocation = false;
                    var searchTerms = ['brabrand', 'holmstrupgaard', 'gellerup'];
                    var allText = (navn + ' ' + stednavn + ' ' + adresse + ' ' + fødested).toLowerCase();
                    
                    searchTerms.forEach(function(term) {
                        if (allText.indexOf(term) !== -1) {
                            isTargetLocation = true;
                        }
                    });
                    
                    if (isTargetLocation) {
                        console.log('\n🎯 FUNDET MÅLLOKATION - Række ' + (i+1) + ':');
                        console.log('   Navn:', navn);
                        console.log('   Stednavn:', stednavn);
                        console.log('   Adresse:', adresse);
                        console.log('   Fødested:', fødested);
                        console.log('   Alle kolonner:');
                        Object.keys(row).forEach(function(key) {
                            console.log('     ' + key + ':', row[key]);
                        });
                    }

                    var lat = null, lng = null;
                    function parseNumber(v) {
                        if (v === null || v === undefined) return NaN;
                        var s = String(v).trim();
                        if (s === '' || s === 'undefined' || s === 'null') return NaN;
                        s = s.replace(',', '.'); // decimalkomma -> punktum
                        return parseFloat(s);
                    }

                    // Søg efter ALLE mulige koordinat-kolonner
                    var coordValue = null;
                    var foundCoordColumn = null;
                    var allKeys = Object.keys(row);
                    
                    // Udvid søgningen til at inkludere alle mulige navne
                    for (var k = 0; k < allKeys.length; k++) {
                        var key = allKeys[k];
                        var lowerKey = key.toLowerCase();
                        
                        if (lowerKey.includes('koordinat') || lowerKey.includes('coord') || 
                            lowerKey === 'lat' || lowerKey === 'lng' || lowerKey === 'lon' ||
                            lowerKey.includes('bredde') || lowerKey.includes('længde') ||
                            lowerKey.includes('latitude') || lowerKey.includes('longitude')) {
                            
                            if (row[key] !== undefined && row[key] !== '' && row[key] !== null) {
                                coordValue = row[key];
                                foundCoordColumn = key;
                                if (isTargetLocation) {
                                    console.log('   📏 Fundet koordinat i kolonne "' + key + '":', coordValue);
                                }
                                break;
                            }
                        }
                    }

                    if (coordValue) {
                        var coordStr = coordValue.toString().trim();
                        if (coordStr && coordStr !== 'undefined' && coordStr !== 'null' && coordStr !== '') {
                            // Simpel parsing - tag bare de første to tal
                            var m = coordStr.match(/[-+]?\d+[.,]?\d*/g);
                            if (m && m.length >= 2) {
                                lat = parseNumber(m[0]);
                                lng = parseNumber(m[1]);
                                
                                console.log('   ✅ FUNDET KOORDINATER for ' + (navn || 'ukendt') + ' på ' + (stednavn || 'ukendt sted') + ': lat=' + lat + ', lng=' + lng);
                            } else {
                                console.log('   ❌ Kunne ikke parse koordinater fra: "' + coordStr + '" for ' + (navn || 'ukendt'));
                            }
                        } else {
                            console.log('   ⚠️ Tom koordinat-værdi for ' + (navn || 'ukendt') + ' i kolonne: ' + foundCoordColumn);
                        }
                    } else {
                        console.log('   ❌ Ingen koordinat-kolonne for ' + (navn || 'ukendt') + ' på ' + (stednavn || 'ukendt sted'));
                    }

                    // Fallback til separate Lat/Lng kolonner
                    if (!isFinite(lat) || !isFinite(lng)) {
                        lat = parseNumber(row['Lat'] || row['lat']);
                        lng = parseNumber(row['Lng'] || row['lng'] || row['Lon'] || row['lon']);
                        
                        if (isFinite(lat) && isFinite(lng) && isTargetLocation) {
                            console.log('   ✅ Bruger separate Lat/Lng kolonner: lat=' + lat + ', lng=' + lng);
                        }
                    }

                    // Tjek om koordinaterne er gyldige tal
                    if (!isFinite(lat) || !isFinite(lng) || lat === null || lng === null) {
                        if (isTargetLocation) {
                            console.log('   ❌ SPRINGER OVER - ingen gyldige koordinater fundet! (lat=' + lat + ', lng=' + lng + ')');
                        }
                        return; // Spring over hvis der ikke er gyldige koordinater
                    }
                    
                    if (isTargetLocation) {
                        console.log('   🎆 OPRETTER MARKER på koordinater: ' + lat + ', ' + lng);
                    }

                    // Bestem farve baseret på køn
                    var fillColor = '#666666'; // fallback
                    if (køn === 'M' || køn === 'm') {
                        fillColor = '#4285f4'; // blå for mænd
                    } else if (køn === 'K' || køn === 'k') {
                        fillColor = '#ea4335'; // rød for kvinder
                    }

                    var marker = L.circleMarker([lat, lng], {
                        radius: 5,
                        color: fillColor,
                        weight: 1,
                        fillColor: fillColor,
                        fillOpacity: 0.8
                    });

                    // Gem data på markøren
                    marker._coords = { lat: lat, lng: lng };
                    marker._year = NaN; // Folketællinger har ikke årstal som sådan
                    marker._meta = { navn: navn, stednavn: stednavn, adresse: adresse, køn: køn };

                    var popup = '<div style="max-width:260px;font-size:13px;line-height:1.3;">' +
                                (navn ? '<div><strong>Navn:</strong> ' + navn + '</div>' : '') +
                                (stednavn ? '<div><strong>Sted:</strong> ' + stednavn + '</div>' : '') +
                                (adresse ? '<div><strong>Adresse:</strong> ' + adresse + '</div>' : '') +
                                (alder ? '<div><strong>Alder:</strong> ' + alder + '</div>' : '') +
                                (køn ? '<div><strong>Køn:</strong> ' + køn + '</div>' : '') +
                                (civilstand ? '<div><strong>Civilstand:</strong> ' + civilstand + '</div>' : '') +
                                (erhverv ? '<div><strong>Erhverv:</strong> ' + erhverv + '</div>' : '') +
                                (fødested ? '<div><strong>Fødested:</strong> ' + fødested + '</div>' : '') +
                                '</div>';
 
                    marker.bindPopup(popup);
                    // Gem i master-listen og i dette specifikke lag
                    allMarkers.push(marker);
                    excelLayer.addLayer(marker);
                    added++;
                    
                    if (isTargetLocation) {
                        console.log('   ✅ MARKER OPRETTET SUCCESFULDT! Total markers: ' + added);
                    }
                });
 
                // Tilføj overlay med det specifikke navn (selv hvis det er tomt)
                try { 
                    layerControl.addOverlay(excelLayer, layerName || 'Excel Data'); 
                    allClusterLayers.push(excelLayer); // Gem til cluster toggle
                    if (added > 0) {
                        console.log('✅ Tilføjet cluster-lag:', layerName, 'med', added, 'punkter');
                    } else {
                        console.log('📋 Tilføjet tomt lag:', layerName, '(ingen koordinater i Excel-fil)');
                    }
                } catch(e){
                    console.error('Kunne ikke tilføje overlay:', e);
                }
 
                console.log('Markers tilføjet fra Excel:', added);
                // Opsæt år-slider hvis vi har årstal (kun første gang)
                if (allMarkers.length === added) { // Første Excel-fil indlæst
                    var years = allMarkers.map(function(m){ return m._year; }).filter(isFinite);
                    if (years.length > 0) {
                        var minY = Math.min.apply(null, years);
                        var maxY = Math.max.apply(null, years);
                        var startMin = 1900;
                        updateYearFilterUI(startMin, maxY);
                        applyYearFilter();
                    }
                }
             }).catch(function(err){
                 console.error('❌ FEJL ved indlæsning af Excel-fil:', path);
                 console.error('Fejl-besked:', err.message);
                 console.error('Fuld fejl:', err);
                 return Promise.reject(err);
             });
         }

        // Indlæs din fil fra mappen "excel"
        loadExcelToMap('./excel/FM.xlsx', 'Friis & Moltke Projekter');
        
        // Funktion til at prøve Excel først, derefter CSV som fallback
        function loadDataWithFallback(excelPath, csvPath, layerName) {
            loadExcelToMap(excelPath, layerName).catch(function() {
                console.log('Excel ikke fundet, prøver CSV:', csvPath);
                return loadCSVToMap(csvPath, layerName + ' (CSV)');
            });
        }

        // Indlæs Excel-filer direkte (de findes allerede)
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1840-csv.xlsx', 'Folketælling 1840');
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1845-csv.xlsx', 'Folketælling 1845');
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1850-csv.xlsx', 'Folketælling 1850');
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1860-csv.xlsx', 'Folketælling 1860');
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1880-csv.xlsx', 'Folketælling 1880');
        loadExcelToMap('./Folketællinger/FT_Brabrand_Sogn_sogn_1901-csv.xlsx', 'Folketælling 1901');

        // Start med kun OSM som baggrund og 1840-kort som overlay
        osm.addTo(map);
        historiskKort1840.addTo(map);

        // Footer (bottom-right) med kun dit navn
        var footer = L.control({position: 'bottomright'});
        footer.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'map-footer');
            div.style.background = 'transparent';
            div.style.padding = '4px 8px';
            div.style.margin = '6px';
            div.style.fontSize = '12px';
            div.style.color = '#222';
            div.style.opacity = '0.95';
            div.style.pointerEvents = 'none';
            div.innerHTML = 'Erik Oehlerich';
            return div;
        };
        footer.addTo(map);

        // Det manuelle skolepunkt er fjernet (marker oprettes nu kun fra Excel-data)
        // Tilføj søgefunktion
        var geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            position: 'topleft',
            placeholder: 'Søg efter adresse...',
            geocoder: new L.Control.Geocoder.Nominatim({
                language: 'da' // Dansk sprog
            })
        }).addTo(map);

        // Håndter søgeresultater
        geocoder.on('markgeocode', function(e) {
            var bbox = e.geocode.bbox;
            var poly = L.polygon([
                bbox.getSouthEast(),
                bbox.getNorthEast(),
                bbox.getNorthWest(),
                bbox.getSouthWest()
            ]);
            map.fitBounds(poly.getBounds());
        });
    </script>
